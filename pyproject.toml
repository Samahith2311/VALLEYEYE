[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "valleyeye"
version = "0.1.0"
description = "A traceable flood impact analysis backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6",
  "rasterio==1.4.3",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyproj==3.7.2",
  "pystac-client==0.9.0",
  "shapely==2.1.1",
  "tenacity==9.1.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]
ml = ["torch==2.7.1"]

[project.scripts]
valleyeye-fetch-weights = "valleyeye.ml.fetch_weights:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/valleyeye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: API-level integration checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pystac_client.*", "rasterio", "rasterio.*", "shapely.*"]
ignore_missing_imports = true
